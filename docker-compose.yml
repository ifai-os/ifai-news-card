services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ifai-news-card:latest
    container_name: ifai-news-card
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Create this ignored file from docker/runtime-config.example.js.
      - ./docker/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
