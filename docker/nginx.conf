server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A lightweight endpoint used by Docker and external load balancers.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration must never be cached; it may change independently
    # from the immutable application image.
    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
